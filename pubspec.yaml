name: snap_sweep
description: "SnapSweep - swipe to clean up your photo gallery."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  shared_preferences: ^2.5.5
  intl: ^0.20.3
  photo_manager: ^3.12.0
  flutter_card_swiper: ^7.2.0
  purchases_flutter: ^10.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700

# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#F9F8F5"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  min_sdk_android: 21

# Regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F9F8F5"
  color_dark: "#141311"
  image: assets/icon/splash.png
  android_12:
    color: "#F9F8F5"
    color_dark: "#141311"
    image: assets/icon/splash.png
  web: false
